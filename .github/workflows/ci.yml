---
name: CI

on:
  pull_request:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
  push:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
    tags:
      - '*'
    branches:
      - '*'

# CI only reads the repository; without this block the token inherits the
# repository default, which may be read/write.
permissions:
  contents: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, dom, json, xml, zip
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Check untranslated strings
        run: make check-untranslated

      - name: Generate .mo file
        run: make compile-mo

      # Called directly rather than through `make lint` / `make test`: those targets
      # depend on deps-update, which runs `composer update` and would test against
      # whatever versions are newest that day instead of composer.lock.
      - name: Run code linting
        run: vendor/bin/phpcs . --standard=PSR2 --ignore=vendor/,asset/,node_modules/,view/,language/,test/Stubs/ --colors --extensions=php

      - name: Run unit tests
        run: vendor/bin/phpunit -c test/phpunit.xml

  build_assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Sass
        run: npm run build
