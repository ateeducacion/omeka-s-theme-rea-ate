      <circle cx="2" cy="2" r="2" fill="#E1E6F0"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1280" height="800" fill="#F4F6FA"/>
  <rect width="1280" height="800" fill="url(#dots)"/>
